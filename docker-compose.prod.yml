# Full stack:  docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Put TLS in front (Cloudflare, a cloud load balancer or certbot) because microphones need HTTPS outside localhost.
x-service: &service
  restart: unless-stopped
  env_file: .env
  depends_on:
    mongo: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      retries: 6
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, retries: 6 }

  auth-service:
    <<: *service
    build: { context: ., dockerfile: deploy/Dockerfile.service, args: { SERVICE: auth-service } }
    environment: { MONGO_URI: "mongodb://mongo:27017/auth_db" }
  content-service:
    <<: *service
    build: { context: ., dockerfile: deploy/Dockerfile.service, args: { SERVICE: content-service } }
    environment: { CONTENT_MONGO_URI: "mongodb://mongo:27017/content_db" }
  scheduler-service:
    <<: *service
    build: { context: ., dockerfile: deploy/Dockerfile.service, args: { SERVICE: scheduler-service } }
    environment: { SCHEDULER_MONGO_URI: "mongodb://mongo:27017/schedule_db" }
  ai-service:
    <<: *service
    build: { context: ., dockerfile: deploy/Dockerfile.service, args: { SERVICE: ai-service } }
    environment:
      AI_MONGO_URI: "mongodb://mongo:27017/interview_db"
      REDIS_URL: "redis://redis:6379"
      SCHEDULER_SERVICE_HOST: scheduler-service
      WEB_ORIGIN: "${PUBLIC_URL:-http://localhost}"
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:4004/health"], interval: 15s, retries: 5 }
  api-gateway:
    <<: *service
    build: { context: ., dockerfile: deploy/Dockerfile.service, args: { SERVICE: api-gateway } }
    environment:
      REDIS_URL: "redis://redis:6379"
      AUTH_SERVICE_HOST: auth-service
      CONTENT_SERVICE_HOST: content-service
      SCHEDULER_SERVICE_HOST: scheduler-service
      AI_SERVICE_HOST: ai-service
      WEB_ORIGIN: "${PUBLIC_URL:-http://localhost}"
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"], interval: 15s, retries: 5 }
  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args: { NEXT_PUBLIC_API_URL: /api, NEXT_PUBLIC_WS_URL: "" }
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [web, api-gateway, ai-service]

volumes:
  mongo_data:
  redis_data:
