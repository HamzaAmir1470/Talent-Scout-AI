# Single public entry point: web on /, REST on /api, Socket.IO on /socket.io
upstream web      { server web:3000; }
upstream gateway  { server api-gateway:4000; }
# ip_hash keeps a candidate's WebSocket on the same AI instance when you scale ai-service horizontally
upstream ai_ws    { ip_hash; server ai-service:4004; }

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Edge rate limits: stop password guessing and floods before they reach the application
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=300r/m;
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 512k;
  limit_conn conn_zone 40;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/auth/ {
    limit_req zone=auth_zone burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://gateway/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    limit_req zone=api_zone burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://gateway/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://ai_ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;   # interviews are long-lived connections
    proxy_send_timeout 3600s;
  }

  location / {
    proxy_pass http://web;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
